name = "ai-trading-intelligence"
main = "src/worker.js"
compatibility_date = "2026-11-23"

[assets]
directory = "./public"
binding = "ASSETS"

[triggers]
crons = ["*/1 * * * *"]

[[durable_objects.bindings]]
name = "TRADING_STATE"
class_name = "TradingState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TradingState"]
